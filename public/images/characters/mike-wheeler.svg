  </defs>
  <rect width="512" height="512" fill="#0d0d14"/>
  <rect width="512" height="512" fill="url(#bg-mike-wheeler)"/>
  <rect width="512" height="512" fill="url(#glow-mike-wheeler)"/>
  <!-- Silhouette shape -->
