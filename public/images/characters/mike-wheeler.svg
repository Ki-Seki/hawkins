      <stop offset="0%" stop-color="#08253c"/>
      <stop offset="100%" stop-color="#0d0d14"/>
    </radialGradient>
    <radialGradient id="glow-mike-wheeler" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2196F3" stop-opacity="0.25"/>
