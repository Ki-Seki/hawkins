<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- Forest texture — dark green visible against near-black background -->
    <pattern id="forest-dots" patternUnits="userSpaceOnUse" width="16" height="16">
      <rect width="16" height="16" fill="#0c1c0c"/>
      <circle cx="4" cy="4" r="2.2" fill="#172e17" opacity="0.85"/>
      <circle cx="12" cy="11" r="1.8" fill="#142814" opacity="0.75"/>
      <circle cx="11" cy="3" r="1.4" fill="#183018" opacity="0.65"/>
      <circle cx="3" cy="12" r="1.6" fill="#1a2e1a" opacity="0.6"/>
    </pattern>
    <!-- Water shimmer — clearly blue-tinted -->
    <pattern id="water-pattern" patternUnits="userSpaceOnUse" width="20" height="8">
      <rect width="20" height="8" fill="#0a1c30"/>
      <line x1="0" y1="2.5" x2="20" y2="2.5" stroke="#1a3d5a" stroke-width="0.8" opacity="0.7"/>
      <line x1="0" y1="5.5" x2="20" y2="5.5" stroke="#162e48" stroke-width="0.5" opacity="0.5"/>
    </pattern>
    <!-- Glow filter for atmospheric elements -->
    <filter id="glow-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <!-- Town center warm glow gradient -->
    <radialGradient id="town-glow" cx="46%" cy="42%" r="28%">
      <stop offset="0%" stop-color="#F57F17" stop-opacity="0.07"/>
      <stop offset="60%" stop-color="#FF9800" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>
    <!-- Lab cold glow -->
    <radialGradient id="lab-glow" cx="88%" cy="82%" r="16%">
      <stop offset="0%" stop-color="#1A237E" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>
    <!-- Vignette -->
    <radialGradient id="vignette-map" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#0d0d14" stop-opacity="0.8"/>
    </radialGradient>
  </defs>

  <!-- ══════════════════════════════════════════════
       BACKGROUND
  ══════════════════════════════════════════════ -->
  <rect width="1200" height="800" fill="#0d0d14"/>

  <!-- ══════════════════════════════════════════════
       TOPOGRAPHIC CONTOUR LINES (subtle but visible)
  ══════════════════════════════════════════════ -->
  <ellipse cx="240" cy="680" rx="180" ry="120" fill="none" stroke="#1e1e2e" stroke-width="1" opacity="0.6"/>
  <ellipse cx="240" cy="680" rx="140" ry="90" fill="none" stroke="#20202e" stroke-width="1" opacity="0.5"/>
  <ellipse cx="980" cy="720" rx="200" ry="130" fill="none" stroke="#1e1e2e" stroke-width="1" opacity="0.6"/>
  <ellipse cx="980" cy="720" rx="150" ry="95" fill="none" stroke="#20202e" stroke-width="1" opacity="0.5"/>
  <ellipse cx="460" cy="200" rx="250" ry="160" fill="none" stroke="#1c1c2a" stroke-width="1" opacity="0.5"/>

  <!-- ══════════════════════════════════════════════
       FOREST / WOODS AREAS
  ══════════════════════════════════════════════ -->
  <!-- Mirkwood — southeast dark forest -->
  <ellipse cx="936" cy="705" rx="130" ry="80" fill="url(#forest-dots)" stroke="#1a2e1a" stroke-width="2" opacity="0.95"/>
  <ellipse cx="920" cy="720" rx="100" ry="60" fill="#0e1e0e" opacity="0.5"/>
  <g opacity="0.7" fill="#1a3018">
    <circle cx="880" cy="695" r="18"/><circle cx="910" cy="680" r="15"/>
    <circle cx="950" cy="688" r="20"/><circle cx="975" cy="710" r="16"/>
    <circle cx="940" cy="725" r="17"/><circle cx="905" cy="720" r="14"/>
    <circle cx="960" cy="740" r="13"/>
  </g>

  <!-- South woods near Lab/Byers -->
  <ellipse cx="1050" cy="745" rx="110" ry="55" fill="url(#forest-dots)" stroke="#1a2e1a" stroke-width="1.5" opacity="0.9"/>

  <!-- Southwest woods near Hopper Cabin -->
  <ellipse cx="290" cy="700" rx="120" ry="70" fill="url(#forest-dots)" stroke="#1a2e1a" stroke-width="1.5" opacity="0.9"/>
  <g opacity="0.6" fill="#182a18">
    <circle cx="250" cy="690" r="22"/><circle cx="290" cy="680" r="18"/>
    <circle cx="320" cy="700" r="20"/><circle cx="270" cy="715" r="15"/>
    <circle cx="310" cy="720" r="16"/>
  </g>

  <!-- North woods strip -->
  <rect x="100" y="0" width="600" height="40" fill="url(#forest-dots)" opacity="0.6"/>

  <!-- East woods edge -->
  <rect x="1050" y="100" width="150" height="500" fill="url(#forest-dots)" opacity="0.6"/>

  <!-- South general woods border -->
  <ellipse cx="600" cy="790" rx="500" ry="60" fill="url(#forest-dots)" opacity="0.5"/>

  <!-- ══════════════════════════════════════════════
       WATER BODIES — clearly blue-tinted
  ══════════════════════════════════════════════ -->
  <!-- Eno River — far west -->
  <path d="M 52 0 Q 48 80 56 160 Q 62 220 50 300 Q 40 370 58 440 Q 68 500 54 570 Q 42 630 60 720 Q 72 780 58 800"
        fill="none" stroke="#1a3a5a" stroke-width="10" stroke-linecap="round" opacity="0.75"/>
  <path d="M 52 0 Q 48 80 56 160 Q 62 220 50 300 Q 40 370 58 440 Q 68 500 54 570 Q 42 630 60 720 Q 72 780 58 800"
        fill="none" stroke="#0f2438" stroke-width="6" stroke-linecap="round" opacity="0.9"/>

  <!-- Loch Nora -->
  <ellipse cx="156" cy="306" rx="52" ry="38" fill="url(#water-pattern)" stroke="#1f4a72" stroke-width="2" opacity="0.9"/>
  <ellipse cx="156" cy="306" rx="52" ry="38" fill="none" stroke="#2a5a85" stroke-width="1" opacity="0.6"/>

  <!-- Lover's Lake -->
  <ellipse cx="780" cy="354" rx="34" ry="26" fill="url(#water-pattern)" stroke="#1f4a72" stroke-width="1.5" opacity="0.9"/>

  <!-- Lake Tippecanoe -->
  <ellipse cx="960" cy="546" rx="28" ry="20" fill="url(#water-pattern)" stroke="#1f4a72" stroke-width="1.5" opacity="0.85"/>

  <!-- Sattler's Quarry — flooded, slightly greenish -->
  <ellipse cx="1104" cy="616" rx="42" ry="32" fill="url(#water-pattern)" stroke="#2a5070" stroke-width="2.5" opacity="0.95"/>
  <ellipse cx="1104" cy="616" rx="42" ry="32" fill="none" stroke="#3a6a90" stroke-width="1" opacity="0.5"/>

  <!-- Danford Creek -->
  <path d="M 680 640 Q 710 660 730 680 Q 750 700 780 710 Q 810 718 840 714"
        fill="none" stroke="#1a3a5a" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
  <path d="M 680 640 Q 710 660 730 680 Q 750 700 780 710 Q 810 718 840 714"
        fill="none" stroke="#0f2438" stroke-width="4" stroke-linecap="round" opacity="0.85"/>

  <!-- ══════════════════════════════════════════════
       TRAIN TRACKS — clearly visible dashed line
  ══════════════════════════════════════════════ -->
  <line x1="996" y1="0" x2="996" y2="680" stroke="#2e2e44" stroke-width="7" opacity="0.9"/>
  <line x1="990" y1="0" x2="990" y2="680" stroke="#38384e" stroke-width="2" opacity="0.8"/>
  <line x1="1002" y1="0" x2="1002" y2="680" stroke="#38384e" stroke-width="2" opacity="0.8"/>
  <g stroke="#30304a" stroke-width="3" opacity="0.7">
    <line x1="984" y1="20" x2="1008" y2="20"/><line x1="984" y1="44" x2="1008" y2="44"/>
    <line x1="984" y1="68" x2="1008" y2="68"/><line x1="984" y1="92" x2="1008" y2="92"/>
    <line x1="984" y1="116" x2="1008" y2="116"/><line x1="984" y1="140" x2="1008" y2="140"/>
    <line x1="984" y1="164" x2="1008" y2="164"/><line x1="984" y1="188" x2="1008" y2="188"/>
    <line x1="984" y1="212" x2="1008" y2="212"/><line x1="984" y1="236" x2="1008" y2="236"/>
    <line x1="984" y1="260" x2="1008" y2="260"/><line x1="984" y1="284" x2="1008" y2="284"/>
    <line x1="984" y1="308" x2="1008" y2="308"/><line x1="984" y1="332" x2="1008" y2="332"/>
    <line x1="984" y1="356" x2="1008" y2="356"/><line x1="984" y1="380" x2="1008" y2="380"/>
    <line x1="984" y1="404" x2="1008" y2="404"/><line x1="984" y1="428" x2="1008" y2="428"/>
    <line x1="984" y1="452" x2="1008" y2="452"/><line x1="984" y1="476" x2="1008" y2="476"/>
    <line x1="984" y1="500" x2="1008" y2="500"/><line x1="984" y1="524" x2="1008" y2="524"/>
    <line x1="984" y1="548" x2="1008" y2="548"/><line x1="984" y1="572" x2="1008" y2="572"/>
    <line x1="984" y1="596" x2="1008" y2="596"/><line x1="984" y1="620" x2="1008" y2="620"/>
    <line x1="984" y1="644" x2="1008" y2="644"/><line x1="984" y1="668" x2="1008" y2="668"/>
  </g>

  <!-- ══════════════════════════════════════════════
       POWER LINES
  ══════════════════════════════════════════════ -->
  <line x1="440" y1="0" x2="996" y2="320" stroke="#28283a" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.7"/>

  <!-- ══════════════════════════════════════════════
       ROAD NETWORK — visible dark gray-purple lines
  ══════════════════════════════════════════════ -->

  <!-- Major diagonal roads -->
  <line x1="540" y1="480" x2="80" y2="800" stroke="#33334c" stroke-width="5" opacity="0.85"/>
  <line x1="540" y1="480" x2="1000" y2="800" stroke="#33334c" stroke-width="5" opacity="0.85"/>
  <line x1="560" y1="600" x2="700" y2="800" stroke="#2c2c42" stroke-width="3.5" opacity="0.75"/>
  <line x1="700" y1="560" x2="870" y2="740" stroke="#33334c" stroke-width="4" opacity="0.85"/>

  <!-- N-S streets -->
  <line x1="400" y1="0" x2="400" y2="600" stroke="#33334c" stroke-width="3.5" opacity="0.8"/>
  <line x1="520" y1="0" x2="520" y2="620" stroke="#33334c" stroke-width="3.5" opacity="0.8"/>
  <line x1="360" y1="80" x2="360" y2="580" stroke="#2c2c42" stroke-width="3" opacity="0.7"/>
  <line x1="440" y1="280" x2="440" y2="640" stroke="#2c2c42" stroke-width="3" opacity="0.7"/>
  <line x1="480" y1="120" x2="480" y2="480" stroke="#282838" stroke-width="2.5" opacity="0.65"/>
  <line x1="700" y1="300" x2="700" y2="580" stroke="#2c2c42" stroke-width="3" opacity="0.7"/>

  <!-- E-W streets -->
  <line x1="300" y1="128" x2="700" y2="128" stroke="#2c2c42" stroke-width="3" opacity="0.7"/>
  <line x1="300" y1="192" x2="700" y2="192" stroke="#2c2c42" stroke-width="3" opacity="0.7"/>
  <line x1="80" y1="320" x2="760" y2="320" stroke="#33334c" stroke-width="4" opacity="0.85"/>
  <line x1="80" y1="448" x2="860" y2="448" stroke="#3a3a55" stroke-width="5" opacity="0.9"/>
  <line x1="80" y1="560" x2="560" y2="560" stroke="#2c2c42" stroke-width="3" opacity="0.7"/>
  <line x1="300" y1="600" x2="760" y2="600" stroke="#2c2c42" stroke-width="3" opacity="0.7"/>
  <line x1="120" y1="680" x2="560" y2="680" stroke="#28283c" stroke-width="2.5" opacity="0.65"/>
  <line x1="80" y1="760" x2="400" y2="760" stroke="#28283c" stroke-width="2.5" opacity="0.65"/>

  <!-- Secondary connectors -->
  <line x1="300" y1="128" x2="300" y2="640" stroke="#28283c" stroke-width="2.5" opacity="0.65"/>
  <line x1="560" y1="320" x2="560" y2="640" stroke="#28283c" stroke-width="2.5" opacity="0.65"/>
  <line x1="640" y1="192" x2="640" y2="480" stroke="#262636" stroke-width="2" opacity="0.55"/>
  <line x1="760" y1="192" x2="760" y2="448" stroke="#262636" stroke-width="2" opacity="0.55"/>
  <line x1="840" y1="320" x2="840" y2="560" stroke="#262636" stroke-width="2" opacity="0.55"/>

  <!-- ══════════════════════════════════════════════
       DOWNTOWN BLOCK FILL (subtle warm center)
  ══════════════════════════════════════════════ -->
  <rect x="300" y="120" width="480" height="450" fill="#121220" opacity="0.7" rx="4"/>

  <!-- ══════════════════════════════════════════════
       FARMLAND FILLS
  ══════════════════════════════════════════════ -->
  <rect x="400" y="620" width="280" height="120" fill="#0f1410" opacity="0.6" rx="2"/>
  <rect x="620" y="580" width="160" height="100" fill="#0f1410" opacity="0.5" rx="2"/>

  <!-- ══════════════════════════════════════════════
       WATER LABELS (very faint)
  ══════════════════════════════════════════════ -->
  <text x="156" y="310" text-anchor="middle" font-size="9" fill="#2a5a80" opacity="0.6"
        font-family="'IBM Plex Mono', monospace" letter-spacing="0.08em">LOCH NORA</text>
  <text x="1104" y="620" text-anchor="middle" font-size="9" fill="#2a5a80" opacity="0.6"
        font-family="'IBM Plex Mono', monospace" letter-spacing="0.08em">QUARRY</text>
  <text x="936" y="715" text-anchor="middle" font-size="10" fill="#1a3018" opacity="0.7"
        font-family="'IBM Plex Mono', monospace" letter-spacing="0.06em">MIRKWOOD</text>

  <!-- ══════════════════════════════════════════════
       ATMOSPHERIC GLOWS
  ══════════════════════════════════════════════ -->
  <!-- Warm amber glow over downtown -->
  <rect width="1200" height="800" fill="url(#town-glow)"/>
  <!-- Cold lab glow in southeast -->
  <rect width="1200" height="800" fill="url(#lab-glow)"/>

  <!-- ══════════════════════════════════════════════
       VIGNETTE
  ══════════════════════════════════════════════ -->
  <rect width="1200" height="800" fill="url(#vignette-map)"/>
</svg>
