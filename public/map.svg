<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- Forest texture pattern -->
    <pattern id="forest-dots" patternUnits="userSpaceOnUse" width="14" height="14">
      <rect width="14" height="14" fill="#081208"/>
      <circle cx="4" cy="4" r="1.8" fill="#0e1e0e" opacity="0.7"/>
      <circle cx="10" cy="10" r="1.5" fill="#0a180a" opacity="0.6"/>
      <circle cx="10" cy="3" r="1.2" fill="#0c1a0c" opacity="0.5"/>
    </pattern>
    <!-- Water shimmer -->
    <pattern id="water-pattern" patternUnits="userSpaceOnUse" width="20" height="8">
      <rect width="20" height="8" fill="#071422"/>
      <line x1="0" y1="3" x2="20" y2="3" stroke="#0d2035" stroke-width="1" opacity="0.6"/>
      <line x1="0" y1="6" x2="20" y2="6" stroke="#0a1a2e" stroke-width="0.5" opacity="0.4"/>
    </pattern>
    <!-- Topographic contour filter -->
    <filter id="glow-soft">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- ══════════════════════════════════════════════
       BACKGROUND
  ══════════════════════════════════════════════ -->
  <rect width="1200" height="800" fill="#0d0d14"/>

  <!-- Subtle terrain gradient overlay -->
  <ellipse cx="500" cy="380" rx="480" ry="340" fill="#0f0f18" opacity="0.4"/>

  <!-- ══════════════════════════════════════════════
       TOPOGRAPHIC CONTOUR LINES (very subtle)
  ══════════════════════════════════════════════ -->
  <!-- Southwest elevation contours near Hopper area -->
  <ellipse cx="240" cy="680" rx="180" ry="120" fill="none" stroke="#161622" stroke-width="1" opacity="0.5"/>
  <ellipse cx="240" cy="680" rx="140" ry="90" fill="none" stroke="#161622" stroke-width="1" opacity="0.4"/>
  <!-- Southeast elevation contours near Lab -->
  <ellipse cx="980" cy="720" rx="200" ry="130" fill="none" stroke="#161622" stroke-width="1" opacity="0.5"/>
  <ellipse cx="980" cy="720" rx="150" ry="95" fill="none" stroke="#161622" stroke-width="1" opacity="0.4"/>
  <!-- Center-north gentle hill -->
  <ellipse cx="460" cy="200" rx="250" ry="160" fill="none" stroke="#14141e" stroke-width="1" opacity="0.4"/>

  <!-- ══════════════════════════════════════════════
       WATER BODIES
  ══════════════════════════════════════════════ -->
  <!-- Loch Nora — west side, x≈13%, y≈38% → ~156, 304 -->
  <ellipse cx="156" cy="306" rx="52" ry="38" fill="url(#water-pattern)" stroke="#0d2a40" stroke-width="1.5" opacity="0.85"/>
  <ellipse cx="156" cy="306" rx="52" ry="38" fill="none" stroke="#1a4060" stroke-width="1" opacity="0.4"/>

  <!-- Lover's Lake — x≈65%, y≈44% → ~780, 352 -->
  <ellipse cx="780" cy="354" rx="34" ry="26" fill="url(#water-pattern)" stroke="#0d2a40" stroke-width="1.5" opacity="0.85"/>

  <!-- Lake Tippecanoe — x≈80%, y≈68% → ~960, 544 -->
  <ellipse cx="960" cy="546" rx="28" ry="20" fill="url(#water-pattern)" stroke="#0d2a40" stroke-width="1.5" opacity="0.8"/>

  <!-- Sattler's Quarry — x≈92%, y≈77% → ~1104, 616 -->
  <ellipse cx="1104" cy="616" rx="42" ry="32" fill="url(#water-pattern)" stroke="#0d2a40" stroke-width="2" opacity="0.9"/>
  <ellipse cx="1104" cy="616" rx="42" ry="32" fill="none" stroke="#1a4060" stroke-width="1" opacity="0.3"/>

  <!-- Danford Creek — irregular path south-center -->
  <path d="M 680 640 Q 710 660 730 680 Q 750 700 780 710 Q 810 718 840 714"
        fill="none" stroke="#0d2a40" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
  <path d="M 680 640 Q 710 660 730 680 Q 750 700 780 710 Q 810 718 840 714"
        fill="none" stroke="#071422" stroke-width="5" stroke-linecap="round" opacity="0.5"/>

  <!-- ══════════════════════════════════════════════
       ENO RIVER — far west, wiggly vertical
  ══════════════════════════════════════════════ -->
  <path d="M 52 0 Q 48 80 56 160 Q 62 220 50 300 Q 40 370 58 440 Q 68 500 54 570 Q 42 630 60 720 Q 72 780 58 800"
        fill="none" stroke="#0d2a40" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
  <path d="M 52 0 Q 48 80 56 160 Q 62 220 50 300 Q 40 370 58 440 Q 68 500 54 570 Q 42 630 60 720 Q 72 780 58 800"
        fill="none" stroke="#071422" stroke-width="6" stroke-linecap="round" opacity="0.6"/>

  <!-- ══════════════════════════════════════════════
       FOREST / WOODS AREAS
  ══════════════════════════════════════════════ -->
  <!-- Mirkwood — southeast, around x=78% y=88% → 936,704 -->
  <ellipse cx="936" cy="705" rx="130" ry="80" fill="url(#forest-dots)" stroke="#0e1e0e" stroke-width="2" opacity="0.9"/>
  <ellipse cx="920" cy="720" rx="100" ry="60" fill="#081208" opacity="0.6"/>
  <!-- Mirkwood tree cluster marks -->
  <g opacity="0.5" fill="#0e200e">
    <circle cx="880" cy="695" r="18"/><circle cx="910" cy="680" r="15"/>
    <circle cx="950" cy="688" r="20"/><circle cx="975" cy="710" r="16"/>
    <circle cx="940" cy="725" r="17"/><circle cx="905" cy="720" r="14"/>
    <circle cx="960" cy="740" r="13"/>
  </g>

  <!-- South woods near Lab/Byers -->
  <ellipse cx="1050" cy="745" rx="110" ry="55" fill="url(#forest-dots)" stroke="#0e1e0e" stroke-width="1.5" opacity="0.8"/>

  <!-- Southwest woods near Hopper Cabin — x≈26% y≈87% → 312, 696 -->
  <ellipse cx="290" cy="700" rx="120" ry="70" fill="url(#forest-dots)" stroke="#0e1e0e" stroke-width="1.5" opacity="0.8"/>
  <g opacity="0.4" fill="#0c1a0c">
    <circle cx="250" cy="690" r="22"/><circle cx="290" cy="680" r="18"/>
    <circle cx="320" cy="700" r="20"/><circle cx="270" cy="715" r="15"/>
    <circle cx="310" cy="720" r="16"/>
  </g>

  <!-- North woods (above Wheeler) -->
  <rect x="100" y="0" width="600" height="40" fill="url(#forest-dots)" opacity="0.5"/>

  <!-- East woods edge (train track side) -->
  <rect x="1050" y="100" width="150" height="500" fill="url(#forest-dots)" opacity="0.5"/>

  <!-- South general woods border -->
  <ellipse cx="600" cy="790" rx="500" ry="60" fill="url(#forest-dots)" opacity="0.4"/>

  <!-- ══════════════════════════════════════════════
       TRAIN TRACKS — far east vertical, x≈83% → ~996
  ══════════════════════════════════════════════ -->
  <!-- Track bed -->
  <line x1="996" y1="0" x2="996" y2="680" stroke="#1a1a28" stroke-width="6" opacity="0.8"/>
  <!-- Rails -->
  <line x1="990" y1="0" x2="990" y2="680" stroke="#222232" stroke-width="2" opacity="0.7"/>
  <line x1="1002" y1="0" x2="1002" y2="680" stroke="#222232" stroke-width="2" opacity="0.7"/>
  <!-- Cross ties -->
  <g stroke="#1e1e2e" stroke-width="3" opacity="0.5">
    <line x1="984" y1="20" x2="1008" y2="20"/><line x1="984" y1="44" x2="1008" y2="44"/>
    <line x1="984" y1="68" x2="1008" y2="68"/><line x1="984" y1="92" x2="1008" y2="92"/>
    <line x1="984" y1="116" x2="1008" y2="116"/><line x1="984" y1="140" x2="1008" y2="140"/>
    <line x1="984" y1="164" x2="1008" y2="164"/><line x1="984" y1="188" x2="1008" y2="188"/>
    <line x1="984" y1="212" x2="1008" y2="212"/><line x1="984" y1="236" x2="1008" y2="236"/>
    <line x1="984" y1="260" x2="1008" y2="260"/><line x1="984" y1="284" x2="1008" y2="284"/>
    <line x1="984" y1="308" x2="1008" y2="308"/><line x1="984" y1="332" x2="1008" y2="332"/>
    <line x1="984" y1="356" x2="1008" y2="356"/><line x1="984" y1="380" x2="1008" y2="380"/>
    <line x1="984" y1="404" x2="1008" y2="404"/><line x1="984" y1="428" x2="1008" y2="428"/>
    <line x1="984" y1="452" x2="1008" y2="452"/><line x1="984" y1="476" x2="1008" y2="476"/>
    <line x1="984" y1="500" x2="1008" y2="500"/><line x1="984" y1="524" x2="1008" y2="524"/>
    <line x1="984" y1="548" x2="1008" y2="548"/><line x1="984" y1="572" x2="1008" y2="572"/>
    <line x1="984" y1="596" x2="1008" y2="596"/><line x1="984" y1="620" x2="1008" y2="620"/>
    <line x1="984" y1="644" x2="1008" y2="644"/><line x1="984" y1="668" x2="1008" y2="668"/>
  </g>

  <!-- ══════════════════════════════════════════════
       POWER LINES — diagonal, top-right area
  ══════════════════════════════════════════════ -->
  <line x1="440" y1="0" x2="996" y2="320" stroke="#1e1e2c" stroke-width="1.5" stroke-dasharray="3 6" opacity="0.5"/>

  <!-- ══════════════════════════════════════════════
       ROAD NETWORK
       Downtown grid: center-north of map
       Roads: subtle dark grey lines
  ══════════════════════════════════════════════ -->

  <!-- === MAJOR DIAGONAL / DIAGONAL ROADS === -->
  <!-- Randolph Lane — diagonal SW, from ~(540,480) toward bottom-left -->
  <line x1="540" y1="480" x2="80" y2="800" stroke="#22222e" stroke-width="4" opacity="0.8"/>
  <!-- Cornwallis Road — diagonal SE toward Lab -->
  <line x1="540" y1="480" x2="1000" y2="800" stroke="#22222e" stroke-width="4" opacity="0.8"/>
  <!-- Mt. Sinai Road — goes south-southeast from downtown -->
  <line x1="560" y1="600" x2="700" y2="800" stroke="#1e1e2a" stroke-width="3" opacity="0.7"/>
  <!-- Kerley Road — southeast toward Lab/Mirkwood -->
  <line x1="700" y1="560" x2="870" y2="740" stroke="#22222e" stroke-width="3.5" opacity="0.8"/>

  <!-- === VERTICAL ROADS (N-S) === -->
  <!-- Maple St — x≈400 -->
  <line x1="400" y1="0" x2="400" y2="600" stroke="#22222e" stroke-width="3" opacity="0.7"/>
  <!-- Cornwallis vertical — x≈520 -->
  <line x1="520" y1="0" x2="520" y2="620" stroke="#22222e" stroke-width="3" opacity="0.7"/>
  <!-- Cherry St — x≈360 -->
  <line x1="360" y1="80" x2="360" y2="580" stroke="#1e1e2a" stroke-width="2.5" opacity="0.6"/>
  <!-- Church St — x≈440 -->
  <line x1="440" y1="280" x2="440" y2="640" stroke="#1e1e2a" stroke-width="2.5" opacity="0.6"/>
  <!-- Elm St (N part) — x≈480 -->
  <line x1="480" y1="120" x2="480" y2="480" stroke="#1e1e2a" stroke-width="2" opacity="0.5"/>
  <!-- Randolph vertical -->
  <line x1="700" y1="300" x2="700" y2="580" stroke="#1e1e2a" stroke-width="2.5" opacity="0.6"/>

  <!-- === HORIZONTAL ROADS (E-W) === -->
  <!-- Dearborn St — y≈128 -->
  <line x1="300" y1="128" x2="700" y2="128" stroke="#1e1e2a" stroke-width="2.5" opacity="0.6"/>
  <!-- Gloucester St — y≈192 -->
  <line x1="300" y1="192" x2="700" y2="192" stroke="#1e1e2a" stroke-width="2.5" opacity="0.6"/>
  <!-- Elm St horizontal — y≈320 -->
  <line x1="80" y1="320" x2="760" y2="320" stroke="#22222e" stroke-width="3.5" opacity="0.8"/>
  <!-- Mulberry St — y≈448 -->
  <line x1="80" y1="448" x2="860" y2="448" stroke="#22222e" stroke-width="4" opacity="0.8"/>
  <!-- Church St horizontal -->
  <line x1="80" y1="560" x2="560" y2="560" stroke="#1e1e2a" stroke-width="2.5" opacity="0.6"/>
  <!-- Kersley St — y≈600 -->
  <line x1="300" y1="600" x2="760" y2="600" stroke="#1e1e2a" stroke-width="2.5" opacity="0.6"/>
  <!-- Garret St — y≈680 -->
  <line x1="120" y1="680" x2="560" y2="680" stroke="#1a1a26" stroke-width="2" opacity="0.5"/>
  <!-- Denfield — bottom -->
  <line x1="80" y1="760" x2="400" y2="760" stroke="#1a1a26" stroke-width="2" opacity="0.5"/>

  <!-- === SMALLER CONNECTORS === -->
  <line x1="300" y1="128" x2="300" y2="640" stroke="#1a1a26" stroke-width="2" opacity="0.5"/>
  <line x1="560" y1="320" x2="560" y2="640" stroke="#1a1a26" stroke-width="2" opacity="0.5"/>
  <line x1="640" y1="192" x2="640" y2="480" stroke="#1a1a26" stroke-width="2" opacity="0.4"/>
  <line x1="760" y1="192" x2="760" y2="448" stroke="#1a1a26" stroke-width="2" opacity="0.4"/>
  <line x1="840" y1="320" x2="840" y2="560" stroke="#1a1a26" stroke-width="2" opacity="0.4"/>

  <!-- ══════════════════════════════════════════════
       DOWNTOWN BLOCK FILLS (slightly lighter area)
  ══════════════════════════════════════════════ -->
  <!-- Main downtown area slightly brighter -->
  <rect x="300" y="120" width="480" height="450" fill="#101018" opacity="0.6" rx="4"/>

  <!-- ══════════════════════════════════════════════
       TOWN / FARMLAND FILLS
  ══════════════════════════════════════════════ -->
  <!-- Farmland south-center -->
  <rect x="400" y="620" width="280" height="120" fill="#0d1008" opacity="0.5" rx="2"/>
  <!-- Field near Merril's Farm -->
  <rect x="620" y="580" width="160" height="100" fill="#0d1008" opacity="0.4" rx="2"/>

  <!-- ══════════════════════════════════════════════
       ATMOSPHERIC VIGNETTE (dark edges)
  ══════════════════════════════════════════════ -->
  <radialGradient id="vignette-map" cx="50%" cy="50%" r="70%">
    <stop offset="0%" stop-color="transparent"/>
    <stop offset="100%" stop-color="#0d0d14" stop-opacity="0.7"/>
  </radialGradient>
  <rect width="1200" height="800" fill="url(#vignette-map)"/>
</svg>
