<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <radialGradient id="townGlow" cx="40%" cy="42%" r="30%">
      <stop offset="0%" stop-color="#151520" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0D0D14" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="labGlow" cx="76%" cy="18%" r="15%">
      <stop offset="0%" stop-color="#0E0E1C" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0D0D14" stop-opacity="1"/>
    </radialGradient>
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="forestTexture">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply"/>
    </filter>
  </defs>

  <!-- Base background -->
  <rect width="1200" height="800" fill="#0D0D14"/>

  <!-- Subtle terrain contour rings (very dark) -->
  <ellipse cx="480" cy="380" rx="420" ry="310" fill="none" stroke="#111118" stroke-width="1" opacity="0.6"/>
  <ellipse cx="480" cy="380" rx="350" ry="250" fill="none" stroke="#111118" stroke-width="1" opacity="0.5"/>
  <ellipse cx="480" cy="380" rx="280" ry="195" fill="none" stroke="#131319" stroke-width="1" opacity="0.5"/>
  <ellipse cx="480" cy="380" rx="210" ry="145" fill="none" stroke="#131319" stroke-width="1" opacity="0.4"/>
  <ellipse cx="480" cy="380" rx="140" ry="100" fill="none" stroke="#141420" stroke-width="1" opacity="0.4"/>

  <!-- Additional contours near lab area -->
  <ellipse cx="920" cy="200" rx="220" ry="170" fill="none" stroke="#0E0E1A" stroke-width="1" opacity="0.5"/>
  <ellipse cx="920" cy="200" rx="160" ry="120" fill="none" stroke="#0F0F1B" stroke-width="1" opacity="0.4"/>

  <!-- Downtown town area (slightly lighter fill) -->
  <rect x="320" y="260" width="260" height="200" rx="30" fill="url(#townGlow)" opacity="0.9"/>

  <!-- Lab district background -->
  <rect x="820" y="80" width="240" height="200" rx="20" fill="url(#labGlow)" opacity="0.8"/>

  <!-- ============ FOREST AREAS ============ -->

  <!-- Mirkwood main forest (east, x=700-880, y=300-600) -->
  <path d="M700,295 Q730,270 780,280 Q830,275 870,300 Q900,325 895,380 Q900,430 885,490 Q875,550 850,590 Q820,620 780,615 Q740,610 710,580 Q685,545 680,490 Q670,420 680,360 Q685,320 700,295 Z"
        fill="#0A1A0A" stroke="#0F2010" stroke-width="1.5" opacity="0.95"/>

  <!-- Mirkwood secondary growth patches -->
  <path d="M720,310 Q745,295 770,305 Q790,310 800,335 Q810,365 795,395 Q780,420 755,415 Q730,408 718,380 Q708,350 720,310 Z"
        fill="#091508" stroke="#0D1E0D" stroke-width="1" opacity="0.8"/>
  <path d="M800,420 Q825,405 850,418 Q868,432 860,465 Q848,492 825,490 Q802,485 793,460 Q787,438 800,420 Z"
        fill="#091508" stroke="#0D1E0D" stroke-width="1" opacity="0.7"/>

  <!-- Northern forest patch (near hopper cabin) -->
  <path d="M140,140 Q175,120 230,130 Q270,138 285,170 Q295,200 280,235 Q262,265 230,270 Q195,272 165,250 Q138,228 132,195 Q126,165 140,140 Z"
        fill="#0A1A0A" stroke="#0F2010" stroke-width="1.5" opacity="0.85"/>

  <!-- Northeast woods strip -->
  <path d="M950,100 Q990,90 1040,108 Q1080,125 1090,170 Q1095,210 1060,240 Q1030,260 990,250 Q950,238 935,200 Q922,165 950,100 Z"
        fill="#0A1A0A" stroke="#0F2010" stroke-width="1.5" opacity="0.8"/>

  <!-- South forest outskirts -->
  <path d="M580,680 Q620,665 670,680 Q710,695 715,730 Q718,760 690,775 Q655,782 620,770 Q588,755 578,725 Q570,700 580,680 Z"
        fill="#0A1A0A" stroke="#0F2010" stroke-width="1" opacity="0.7"/>

  <!-- Scattered small forest patches -->
  <ellipse cx="160" cy="500" rx="55" ry="45" fill="#0A1A0A" stroke="#0F2010" stroke-width="1" opacity="0.6"/>
  <ellipse cx="1050" cy="600" rx="70" ry="55" fill="#0A1A0A" stroke="#0F2010" stroke-width="1" opacity="0.65"/>
  <ellipse cx="950" cy="680" rx="55" ry="40" fill="#0A1A0A" stroke="#0F2010" stroke-width="1" opacity="0.6"/>
  <ellipse cx="320" cy="660" rx="45" ry="38" fill="#0A1A0A" stroke="#0F2010" stroke-width="1" opacity="0.55"/>

  <!-- ============ WATER / QUARRY AREA ============ -->
  <!-- Sattler Quarry water -->
  <ellipse cx="696" cy="576" rx="60" ry="45" fill="#0A1428" stroke="#0D1830" stroke-width="2" opacity="0.9"/>
  <ellipse cx="696" cy="576" rx="45" ry="32" fill="#0C1830" stroke="#0F1F38" stroke-width="1" opacity="0.7"/>

  <!-- Small river/creek running south from lab area -->
  <path d="M880,240 Q870,310 850,380 Q840,430 830,480 Q820,530 810,580 Q800,630 790,680"
        fill="none" stroke="#0A1428" stroke-width="4" opacity="0.5"/>
  <path d="M880,240 Q870,310 850,380 Q840,430 830,480 Q820,530 810,580 Q800,630 790,680"
        fill="none" stroke="#0D1B35" stroke-width="2" opacity="0.4"/>

  <!-- ============ ROADS ============ -->

  <!-- Main diagonal road (northwest to southeast) -->
  <path d="M50,650 Q150,580 250,500 Q350,420 450,360 Q550,300 650,240 Q750,180 850,130 Q950,80 1050,50"
        fill="none" stroke="#2A2A3A" stroke-width="5" stroke-linecap="round"/>
  <path d="M50,650 Q150,580 250,500 Q350,420 450,360 Q550,300 650,240 Q750,180 850,130 Q950,80 1050,50"
        fill="none" stroke="#1E1E2E" stroke-width="2" stroke-linecap="round" stroke-dasharray="20,40"/>

  <!-- Main horizontal road (west–east, mid-height ~y=340) -->
  <path d="M0,345 Q100,340 200,342 Q300,344 400,340 Q500,336 600,338 Q700,340 800,342 Q900,344 1000,346 Q1100,348 1200,345"
        fill="none" stroke="#2A2A3A" stroke-width="5" stroke-linecap="round"/>

  <!-- Main vertical road (north–south, x≈450) -->
  <path d="M450,0 Q452,100 450,200 Q448,300 450,400 Q452,500 450,600 Q448,700 450,800"
        fill="none" stroke="#2A2A3A" stroke-width="5" stroke-linecap="round"/>

  <!-- Secondary horizontal road (y≈480) -->
  <path d="M0,482 Q200,478 400,480 Q600,482 800,484 Q1000,485 1200,480"
        fill="none" stroke="#2A2A3A" stroke-width="3" stroke-linecap="round"/>

  <!-- Secondary vertical road (x≈620) -->
  <path d="M622,0 Q620,150 622,300 Q624,450 620,600 Q618,700 622,800"
        fill="none" stroke="#2A2A3A" stroke-width="3" stroke-linecap="round"/>

  <!-- Lab access road -->
  <path d="M912,144 Q900,180 880,220 Q860,260 840,300 Q820,340 800,360"
        fill="none" stroke="#2A2A3A" stroke-width="4" stroke-linecap="round"/>

  <!-- Byers road connecting to main -->
  <path d="M792,440 Q770,430 740,420 Q710,410 680,400 Q650,390 622,385"
        fill="none" stroke="#2A2A3A" stroke-width="3" stroke-linecap="round"/>

  <!-- Quarry road -->
  <path d="M696,576 Q680,550 660,530 Q640,510 622,500"
        fill="none" stroke="#2A2A3A" stroke-width="3" stroke-linecap="round"/>

  <!-- Hopper cabin road -->
  <path d="M264,224 Q280,260 310,300 Q340,340 370,350"
        fill="none" stroke="#2A2A3A" stroke-width="3" stroke-linecap="round"/>

  <!-- Downtown cross streets -->
  <path d="M350,260 Q355,300 358,340 Q360,380 362,420 Q364,460 366,500"
        fill="none" stroke="#222230" stroke-width="2" stroke-linecap="round"/>
  <path d="M290,345 Q330,343 370,341 Q410,339 450,340 Q490,341 530,342 Q570,343 600,344"
        fill="none" stroke="#222230" stroke-width="2" stroke-linecap="round"/>
  <path d="M290,420 Q340,418 390,420 Q440,422 490,420 Q540,418 580,420"
        fill="none" stroke="#222230" stroke-width="2" stroke-linecap="round"/>
  <path d="M410,260 Q412,310 414,360 Q416,410 414,460 Q412,510 410,560"
        fill="none" stroke="#222230" stroke-width="2" stroke-linecap="round"/>
  <path d="M500,260 Q502,300 500,340 Q498,380 500,420 Q502,460 500,500"
        fill="none" stroke="#222230" stroke-width="2" stroke-linecap="round"/>

  <!-- Mirkwood path/trail -->
  <path d="M622,385 Q650,390 680,400 Q710,410 740,430 Q760,450 770,480"
        fill="none" stroke="#1E1E2A" stroke-width="2" stroke-dasharray="8,12" stroke-linecap="round"/>

  <!-- ============ SUBTLE TOPOGRAPHIC DETAIL ============ -->
  <!-- Low-lying area shading west of town -->
  <path d="M80,350 Q120,330 160,340 Q200,350 220,380 Q230,410 210,430 Q190,450 160,445 Q130,438 100,415 Q75,390 80,350 Z"
        fill="#0E0E16" opacity="0.4"/>

  <!-- Elevated ridge near lab (northeast) -->
  <path d="M880,60 Q930,50 980,70 Q1020,90 1030,130 Q1035,165 1010,185 Q985,200 950,192 Q915,182 895,155 Q875,128 880,60 Z"
        fill="#0E0E16" opacity="0.35"/>

  <!-- Slight depression for quarry basin -->
  <ellipse cx="696" cy="590" rx="80" ry="55" fill="#0C0C18" opacity="0.3"/>

  <!-- ============ ATMOSPHERIC DARK CORNERS ============ -->
  <radialGradient id="cornerDark" cx="50%" cy="50%" r="70%">
    <stop offset="60%" stop-color="transparent"/>
    <stop offset="100%" stop-color="#080810" stop-opacity="0.8"/>
  </radialGradient>
  <rect width="1200" height="800" fill="url(#cornerDark)"/>

</svg>
