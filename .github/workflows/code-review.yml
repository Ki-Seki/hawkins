name: Copilot Code Review

# 手动触发，可选填关注领域
on:
  workflow_dispatch:
    inputs:
      focus:
        description: "关注领域（逗号分隔，留空则审查全部）"
        required: false
        default: "重构,重复代码,简化,性能,类型安全"

permissions:
  contents: read
  issues: write

jobs:
  review:
    name: AI code review via Copilot CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install project dependencies
        run: npm ci

      # --- Static analysis (typecheck / lint / build) ---
      - name: TypeScript check
        run: npm run typecheck 2>&1 | tee /tmp/typecheck.txt
        continue-on-error: true

      - name: ESLint
        run: npm run lint 2>&1 | tee /tmp/lint.txt
        continue-on-error: true

      - name: Build & collect bundle size
        run: |
          npm run build 2>&1 | tee /tmp/build.txt
          if [ -d dist ]; then
            echo "--- dist size ---" >> /tmp/build.txt
            du -sh dist/ >> /tmp/build.txt
          fi
        continue-on-error: true

      # --- Install Copilot CLI ---
      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      # --- Run Copilot CLI to produce AI review ---
      # Requires a fine-grained PAT with "Copilot requests" permission
      # stored as repository secret COPILOT_PAT
      - name: Run Copilot CLI review
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        run: |
          FOCUS="${{ github.event.inputs.focus }}"
          TYPECHECK=$(cat /tmp/typecheck.txt | head -40)
          LINT=$(cat /tmp/lint.txt | head -40)
          BUILD_OUT=$(cat /tmp/build.txt | tail -20)

          copilot -p "你是一位资深 TypeScript/React 工程师，正在对 Hawkins 项目（一个纯静态 React+Vite+TS 应用）进行代码质量审查。\
          请分析 src/ 目录下的所有源文件，以及 vite.config.ts、tailwind.config.ts、eslint.config.js。\
          重点关注以下方面：${FOCUS}。\
          \
          本次运行的静态分析结果：\
          TypeScript 检查：${TYPECHECK}\
          ESLint：${LINT}\
          构建输出：${BUILD_OUT}\
          \
          对于发现的每个问题，请提供：\
          - **文件**（路径 + 行号范围）\
          - **问题描述**（问题是什么，为什么重要）\
          - **改进建议**（具体修复方案，必要时附代码片段）\
          - **优先级**：🔴 高 / 🟡 中 / 🟢 低\
          \
          请在开头写一段执行摘要（不超过 150 字）。\
          请用中文写作，将完整的审查报告写入 review.md。" \
          --allow-tool='shell(git:*)' \
          --allow-tool='shell(find:*)' \
          --allow-tool='shell(cat:*)' \
          --allow-tool=read \
          --allow-tool=write \
          --no-ask-user

      # --- 将审查结果开成 GitHub Issue ---
      - name: Create review issue
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const date = new Date().toISOString().split('T')[0];
            const focus = `${{ github.event.inputs.focus }}`;
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;

            let review = '';
            try {
              review = fs.readFileSync('review.md', 'utf8');
            } catch {
              review = '_Copilot CLI 未生成审查文件，请查看 Actions 日志了解详情。_';
            }

            const body = [
              `> **触发人**：@${{ github.actor }} · [查看本次运行](${runUrl})`,
              `> **关注领域**：${focus}`,
              '',
              review,
            ].join('\n');

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔍 代码审查：${focus} — ${date}`,
              body,
              labels: ['code-review'],
            });

            core.summary.addHeading('审查 Issue 已创建', 3);
            core.summary.addLink(`Issue #${issue.data.number}`, issue.data.html_url);
            await core.summary.write();
            console.log(`Created: ${issue.data.html_url}`);
